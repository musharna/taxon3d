version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Template-owned (repo-template): pins are bumped there and arrive by resync.
    # Bumping them here makes this repo drift; guardrails-sync.sh --check enforces this list.
    exclude-paths:
      - ".github/workflows/guardrails.yml"
      - ".github/workflows/nightly-guardrails.yml"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
