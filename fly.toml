# Public instance. Everything here is non-secret by construction — credentials live in
# `fly secrets`, never in this file (it is committed).
#
# The posture this file encodes: BIO3D_RECON_SCORER_URL is empty, which is what makes this a
# PUBLIC deploy (app/config.py). That single switch turns scoring off and hard-404s the internal
# research pages, so the public instance can never recompute a score or expose an internal
# surface — see deploy/README.md.

app = "bio3d-arena"
# The database is a file on the volume below, and a Fly volume cannot leave its region, so
# the machine cannot either. This is no longer a latency preference — it is a hard constraint.
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # Empty = public posture. Do not set this on the public instance.
  BIO3D_RECON_SCORER_URL = ""

  # Assets are in Cloudflare R2, not on the machine. The bucket name is not a secret; the
  # credentials and the account endpoint are, and are set with `fly secrets`.
  BIO3D_STORAGE_BACKEND = "s3"
  AWS_DEFAULT_REGION = "auto"   # R2 ignores region, but boto3 refuses to build a client without one

  # Absolute URLs in share cards, OG tags and canonical links. Left unset, the app would
  # advertise itself as localhost to every crawler and every shared link.
  BIO3D_PUBLIC_BASE_URL = "https://taxon3d.org"

  BIO3D_REQUIRE_CAPTCHA = "true"
  BIO3D_CAPTCHA_PROVIDER = "turnstile"

  # Fly terminates TLS at its edge and forwards, so every request arrives from the proxy's
  # address. Without this, per-IP vote rate limiting sees ONE client — every visitor on earth
  # would share a single 300-votes-per-60s bucket, and the anti-farming layer would be both
  # useless (one farmer looks like the crowd) and harmful (real voters throttle each other).
  BIO3D_TRUST_FORWARDED_FOR = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Never scale to zero. A cold start pays for a Python import plus a Bradley-Terry fit on
  # first request, and the first thing a launch visitor does is load the leaderboard.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

# The database. The Dockerfile has always set BIO3D_DATA_DIR=/data and declared VOLUME
# ["/data"] — but with no mount here, /data was the container's ephemeral layer, so the app
# ran on managed Postgres instead and every page view crossed a metered network.
#
# It now runs on a SQLite file on this volume. That is the app's original backend and is still
# fully supported in app/database.py (WAL, busy timeout, per-connection foreign_keys=ON). The
# reason for the move is not cost alone: a managed database bills egress per byte, so a crawler
# can exhaust the quota and suspend the database — which is exactly what took the site down on
# 2026-08-08. A local file has no egress meter, so that failure cannot recur.
#
# What this trades away: the database now lives on ONE volume in ONE region, so it is only as
# durable as that volume plus Fly's scheduled snapshots (daily, 5-day retention). Votes cast
# here are the only copy until they are harvested into data/study/arena-study.db, so harvest
# before every release — see deploy/README.md.
[[mounts]]
  source = "bio3d_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB, not the 512 MB default: the leaderboard fits Bradley-Terry with a 200-sample bootstrap
  # (config.BT_BOOTSTRAP) and holds the rating tables in memory while it does.
  memory = "1gb"
