[project]
name = "bio3d-arena"
version = "0.2.0"
description = "Anonymous pairwise comparison + voting platform for biological 3D generations"
# 3.12 is the real floor, set by the pinned scipy/tifffile in requirements.txt — not an
# aspiration. The previous ">=3.10" was untested: no 3.10 or 3.11 environment can resolve
# the dependency set the app is actually built and tested against.
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mutmut]
source_paths = ["app"]
also_copy = [".dockerignore", ".github", ".gitignore", ".pre-commit-config.yaml", ".prettierignore", "CHANGELOG.md", "CITATION.cff", "Dockerfile", "LICENSE", "README.md", "blender", "conftest.py", "deploy", "docs", "fly.toml", "helios", "lpy", "requirements-dev.txt", "requirements-research.txt", "requirements-scale.txt", "requirements.txt", "scripts"]
# test_runtime_deps inspects app imports against the requirements files, and mutation adds imports of its own
# the *_crops_wired tests treat an existing data/assets dir as the runtime volume, but the app creates that dir under cwd at import, which under mutmut is mutants/
pytest_add_cli_args = ["--deselect", "tests/test_runtime_deps.py::test_every_top_level_app_import_is_installable_from_the_runtime_files", "-k", "not crops_wired"]
