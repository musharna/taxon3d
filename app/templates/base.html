<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Bio 3D Arena{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Viewer registry (loaded once, used per asset format):
         model-viewer → GLB/GLTF meshes; 3Dmol.js → PDB/mmCIF molecular structures -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">🧬 Bio 3D Arena</a>
      <nav>
        <a href="/">Arena</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/tasks">Tasks</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="foot">
      Anonymous pairwise comparison of biological 3D generations · MVP
    </footer>
  </body>
</html>
